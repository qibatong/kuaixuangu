<!DOCTYPE html>
<html><head><meta charset='utf-8'><title>K线诊断 - ECharts渲染测试</title>
<script src='https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js'></script>
<style>
  body{background:#121418;color:#e5e7eb;font-family:system-ui,sans-serif;margin:16px}
  h2{margin:8px 0 16px}
  .summary{background:#0b0d10;border:1px solid #22272e;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-family:monospace;white-space:pre-wrap}
  .row{display:flex;flex-wrap:wrap;gap:16px}
  .card{flex:1 1 48%;min-width:480px;background:#0b0d10;border:1px solid #22272e;border-radius:8px;padding:8px 12px}
  .chart{width:100%;height:360px;background:#0f1115;border-radius:4px;margin-top:4px}
  .tag{display:inline-block;padding:3px 10px;margin:4px 2px;border-radius:999px;font-size:12px;background:#1f2937;border:1px solid #374151;color:#d1d5db}
  .tag.pass{background:#065f46;border-color:#047857;color:#d1fae5}
  .tag.fail{background:#991b1b;border-color:#b91c1c;color:#fee2e2}
</style>
</head><body>
<h2>ECharts K线渲染诊断 (复制 StockChartModal.vue 的 optionCandle / optionMinute)</h2>
<div class="summary" id="summary">测试进行中…</div>
<div class="row">
  <div class="card"><span class="tag" id="tag_day">日K 模拟000001 · 140条</span><div id="c_day" class="chart"></div></div>
  <div class="card"><span class="tag" id="tag_week">周K 模拟000001 · 1760条</span><div id="c_week" class="chart"></div></div>
  <div class="card"><span class="tag" id="tag_month">月K 模拟000001 · 419条</span><div id="c_month" class="chart"></div></div>
  <div class="card"><span class="tag" id="tag_min">分时图 模拟000001 · 241条</span><div id="c_min" class="chart"></div></div>
</div>
<script>
/* ---- helpers (和 /frontend/src/utils/chart.js 保持一致) ---- */
function fmtNum(v){return v==null||v===''?'-':Number(v).toFixed(2)}
function fmtVol(v){if(v==null||v==='')return '-';const n=Number(v);if(!isFinite(n))return '-';if(Math.abs(n)>=1e12)return(n/1e12).toFixed(2)+'万亿';if(Math.abs(n)>=1e8)return(n/1e8).toFixed(2)+'亿';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(2)+'万';return n.toFixed(0)}
function fmtVolShort(v){const n=Number(v)||0;if(Math.abs(n)>=1e8)return(n/1e8).toFixed(1)+'亿';if(Math.abs(n)>=1e4)return(n/1e4).toFixed(1)+'万';return n.toFixed(0)}

/* ---- 模拟和生产 HTTP API 响应一致规模的数据集 ---- */
function buildResp(period, preClose) {
  const N = { minute:241, day:140, week:1760, month:419 }[period];
  const r = { ok:true, period, code:'000001', preClose: preClose||11.20,
              time:[], price:[], avg:[], volume:[], open:[], close:[], high:[], low:[], amount:[] };
  let price = r.preClose;
  // 固定随机种子，保证每次测试一致
  let seed = 20260821 + N;
  function rand() { seed = (seed * 1664525 + 1013904223) >>> 0; return (seed & 0xffffffff) / 0x100000000; }
  for (let i=0; i<N; i++) {
    if (period==='minute') {
      const mins = 9*60 + Math.floor(i*240/Math.max(N,1));
      r.time.push(String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0'));
      price = price + (rand()-0.48)*0.02;
      r.price.push(+price.toFixed(2));
      r.avg.push(+(price*(0.98+rand()*0.04)).toFixed(2));
      r.volume.push(Math.floor(rand()*2e6));
    } else {
      const step = period==='day'?1 : period==='week'?7 : 30;
      const d = new Date(2026,7,20); d.setDate(d.getDate() - (N-1-i)*step);
      r.time.push(d.toISOString().slice(0,10));
      const open  = +(price + (rand()-0.5)*0.2).toFixed(2);
      const close = +(open  + (rand()-0.48)*0.4).toFixed(2);
      const high  = +(Math.max(open,close) + rand()*0.2).toFixed(2);
      const low   = +(Math.min(open,close) - rand()*0.2).toFixed(2);
      const vol   = Math.floor(rand()*2e8);
      r.open.push(open); r.close.push(close); r.high.push(high); r.low.push(low);
      r.volume.push(vol); r.amount.push(+((vol*close)).toFixed(0));
      price = close;
    }
  }
  return r;
}

/* ========= optionCandle : 完全复制 /frontend/src/components/StockChartModal.vue 源码 L288-L386 ========= */
function optionCandle(d, preCloseVal) {
  const times = d.time || []
  const opens = d.open || [], closes = d.close || []
  const highs = d.high || [], lows = d.low || []
  const vols = d.volume || [], amounts = d.amount || []
  const base = preCloseVal
  // OHLC Candlestick
  const ohlc = times.map((_, i) => [opens[i], closes[i], lows[i], highs[i]])
  // 涨跌色成交量
  const volData = times.map((_, i) => {
    const c = closes[i], o = opens[i]
    const color = c > o ? '#ef4444' : c < o ? '#22c55e' : '#6b7280'
    return { value: vols[i] || 0, itemStyle: { color } }
  })
  return {
    animation: false,
    tooltip: {
      trigger: 'axis',
      axisPointer: { type: 'cross' },
      backgroundColor: 'rgba(20,22,28,0.94)', borderColor: '#374151',
      textStyle: { color: '#e5e7eb', fontSize: 12 },
      formatter: (params) => {
        if (!params || !params.length) return ''
        const idx = params[0].dataIndex
        const tm = times[idx] || ''
        const o = opens[idx], c = closes[idx], h = highs[idx], l = lows[idx]
        const v = vols[idx], am = amounts[idx]
        const chg = base && o ? +((c - base) / base * 100).toFixed(2) : null
        const color = chg >= 0 ? '#ef4444' : '#22c55e'
        return `<b>${tm}</b><br/>开: <b>${fmtNum(o)}</b> 收: <b style="color:${color}">${fmtNum(c)}</b> ${chg != null ? `<span style="color:${color}">${chg >= 0 ? '+' : ''}${chg}%</span>` : ''}<br/>高: ${fmtNum(h)} 低: ${fmtNum(l)}<br/>量: ${fmtVol(v)}${am != null ? `<br/>额: ${fmtVol(am)}` : ''}`
      }
    },
    axisPointer: { link: [{ xAxisIndex: 'all' }], label: { backgroundColor: '#1f2937' } },
    grid: [
      { left: 60, right: 24, top: 20, height: '55%' },
      { left: 60, right: 24, top: '75%', height: '18%' },
    ],
    xAxis: [
      { type: 'category', data: times, scale: true, boundaryGap: true,
        gridIndex: 0, axisLine: { lineStyle: { color: '#555' } },
        axisLabel: { show: false }, axisTick: { show: false } },
      { type: 'category', data: times, scale: true, boundaryGap: true,
        gridIndex: 1, axisLine: { lineStyle: { color: '#555' } },
        axisLabel: { color: '#9ca3af', fontSize: 11 },
      },
    ],
    yAxis: [
      { type: 'value', gridIndex: 0, scale: true,
        axisLabel: { color: '#9ca3af', fontSize: 11, formatter: v => Number(v).toFixed(2) },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } },
      },
      { type: 'value', gridIndex: 1,
        axisLabel: { color: '#9ca3af', fontSize: 10, formatter: fmtVolShort },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } } },
    ],
    dataZoom: [
      { type: 'inside', xAxisIndex: [0, 1], start: 50, end: 100 },
      { type: 'slider', xAxisIndex: [0, 1], start: 50, end: 100,
        bottom: 2, height: 18, borderColor: 'transparent',
        backgroundColor: 'rgba(255,255,255,0.04)',
        fillerColor: 'rgba(59,130,246,0.2)',
        handleStyle: { color: '#3b82f6' },
        textStyle: { color: '#9ca3af', fontSize: 10 },
      },
    ],
    series: [
      { name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0,
        data: ohlc,
        itemStyle: {
          color: '#ef4444', color0: '#22c55e',
          borderColor: '#ef4444', borderColor0: '#22c55e',
        }
      },
      { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: volData, barWidth: '60%' },
    ]
  }
}

/* ========= optionMinute : 完全复制 /frontend/src/components/StockChartModal.vue 源码 ========= */
function pctArr(arr, base) {
  if (!base) return arr.map(() => null)
  return arr.map(v => (v == null || v === '' ? null : +((v - base) / base * 100).toFixed(2)))
}
function optionMinute(d) {
  const times = d.time || []
  const prices = d.price || []
  const avgs = d.avg || []
  const vols = d.volume || []
  const base = d.preClose || (prices[0] && Number(prices[0]))
  const pricePct = pctArr(prices, base)
  const avgPct = pctArr(avgs, base)
  const volData = times.map((_, i) => {
    const color = i === 0 ? '#999'
      : (prices[i] > prices[i - 1] ? '#ef4444' : prices[i] < prices[i - 1] ? '#22c55e' : '#999')
    return { value: vols[i] || 0, itemStyle: { color } }
  })
  return {
    animation: false,
    tooltip: { trigger: 'axis', axisPointer: { type: 'cross' },
      backgroundColor: 'rgba(20,22,28,0.94)', borderColor: '#374151',
      textStyle: { color: '#e5e7eb', fontSize: 12 } },
    grid: [
      { left: 60, right: 24, top: 20, height: '55%' },
      { left: 60, right: 24, top: '75%', height: '18%' },
    ],
    xAxis: [
      { type: 'category', data: times, boundaryGap: false,
        gridIndex: 0, axisLine: { lineStyle: { color: '#555' } },
        axisLabel: { show: false }, axisTick: { show: false } },
      { type: 'category', data: times, boundaryGap: false,
        gridIndex: 1, axisLine: { lineStyle: { color: '#555' } },
        axisLabel: { color: '#9ca3af', fontSize: 11 },
      },
    ],
    yAxis: [
      { type: 'value', gridIndex: 0, position: 'left',
        axisLabel: { color: '#9ca3af', fontSize: 11, formatter: st => (st).toFixed(2) + '%' },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } } },
      { type: 'value', gridIndex: 1,
        axisLabel: { color: '#9ca3af', fontSize: 10, formatter: fmtVolShort },
        splitLine: { lineStyle: { color: 'rgba(255,255,255,0.05)' } } },
    ],
    dataZoom: [ { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 } ],
    series: [
      { name: '价格%', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: pricePct,
        smooth: true, symbol: 'none', lineStyle: { width: 2, color: '#3b82f6' } },
      { name: '均价%', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: avgPct,
        smooth: true, symbol: 'none', lineStyle: { width: 1, color: '#f59e0b' } },
      { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: volData, barWidth: '60%' },
    ]
  }
}

/* ---- 渲染 + 验证 ---- */
function renderChart(domId, period, optionFactory, data) {
  const el = document.getElementById(domId);
  const tag = document.getElementById('tag_'+period);
  const warns = [];
  const origWarn = console.warn, origErr = console.error;
  console.warn = (...a)=>{ warns.push('[WARN] '+a.map(x=>String(x).slice(0,200)).join(' | ')); origWarn.apply(console,a); };
  console.error= (...a)=>{ warns.push('[ERR]  '+a.map(x=>String(x).slice(0,200)).join(' | ')); origErr.apply(console,a); };
  try {
    const chart = echarts.init(el, null, { renderer:'canvas' });
    chart.setOption(optionFactory, true);
    // 获取实际渲染 option
    const applied = chart.getOption();
    const series = applied.series || [];
    const candleSer = series.find(s=>s.type==='candlestick');
    const barSer    = series.filter(s=>s.type==='bar');
    const lineSer   = series.filter(s=>s.type==='line');
    const candleCount = candleSer?.data?.length || 0;
    const barCount    = barSer.reduce((n,s)=>n+(s.data?.length||0), 0);
    const lineCount   = lineSer.reduce((n,s)=>n+(s.data?.length||0), 0);
    const xCount = (applied.xAxis && applied.xAxis[0]?.data?.length) || 0;
    console.warn = origWarn; console.error = origErr;

    const expected = data.time.length;
    let ok = true, reasons = [];
    if (period==='minute') {
      if (lineCount < expected*0.5) { ok=false; reasons.push('line数据不足 '+lineCount+'/'+expected); }
      if (barCount  < expected*0.5) { ok=false; reasons.push('bar数据不足 '+barCount+'/'+expected); }
    } else {
      if (candleCount !== expected) { ok=false; reasons.push('candle数不对 '+candleCount+'/'+expected); }
      if (barCount    < expected*0.5) { ok=false; reasons.push('bar不足 '+barCount+'/'+expected); }
      if (xCount      !== expected)   { ok=false; reasons.push('xAxis data数不对 '+xCount+'/'+expected); }
    }
    if (warns.length) reasons.push('echarts警告:'+warns.join(' ; '));
    if (ok) tag.classList.add('pass'); else tag.classList.add('fail');
    const title = tag.textContent.trim();
    tag.innerHTML = `${title} — <b>${ok?'✅ PASS':'❌ FAIL'}</b>  candle=${candleCount} line=${lineCount} bar=${barCount} x=${xCount}`
      + (reasons.length?` <span style="color:#f87171">${reasons.join(' | ')}</span>`:'');
    return { period, ok, candleCount, lineCount, barCount, xCount, expected, warns, reasons };
  } catch (e) {
    console.warn = origWarn; console.error = origErr;
    tag.classList.add('fail');
    tag.innerHTML += ` — <b>❌ CRASH</b> ${String(e)}`;
    return { period, ok:false, crash: String(e), warns };
  }
}

window.addEventListener('load', () => {
  const results = [];
  const dDay   = buildResp('day',   11.20);
  const dWeek  = buildResp('week',  11.20);
  const dMonth = buildResp('month', 11.20);
  const dMin   = buildResp('minute',11.20);
  results.push(renderChart('c_day',   'day',   optionCandle(dDay,   dDay.preClose),   dDay));
  results.push(renderChart('c_week',  'week',  optionCandle(dWeek,  dWeek.preClose),  dWeek));
  results.push(renderChart('c_month', 'month', optionCandle(dMonth, dMonth.preClose), dMonth));
  results.push(renderChart('c_min',   'min',   optionMinute(dMin),  dMin));
  const allPass = results.every(r=>r.ok);
  document.getElementById('summary').textContent =
    `ECharts版本: v${echarts.version || 'unknown'}\n` +
    `总体结果: ${allPass ? '✅ 全部通过 - 当前源码 optionCandle/optionMinute 逻辑正确' : '❌ 存在失败 - 需要修复'}\n\n` +
    results.map(r=>JSON.stringify(r)).join('\n');
  window.__TEST_RESULT__ = { allPass, results, echartsVersion: echarts.version };
});
</script>
</body></html>
